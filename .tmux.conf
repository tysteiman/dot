# ─── Palette: Kanagawa ─────────────────────────────────────────────
# Hex is lowercase on purpose: some styles get format-expanded (e.g. the prompt
# via message-format, #{?…} branches), where tmux reads "#D"/"#F" as the pane
# id / window flags and the colour silently breaks.
%hidden BAR="#16161d"      # sumiInk0  – status bar
%hidden INK="#2a2a37"      # sumiInk2  – subtle surfaces
%hidden INK3="#363646"     # sumiInk3  – pill fill / inactive borders
%hidden FG="#dcd7ba"       # fujiWhite
%hidden FG2="#c8c093"      # oldWhite
%hidden GRAY="#727169"     # fujiGray
%hidden VIOLET="#957fb8"   # oniViolet – active accent
%hidden BLUE="#7e9cd8"     # crystalBlue
%hidden PINK="#d27e99"     # sakuraPink – copy-mode mark
%hidden GREEN="#98bb6c"    # springGreen – prefix active
%hidden YELLOW="#e6c384"   # carpYellow – copy mode
%hidden RED="#e46876"      # waveRed
%hidden ORANGE="#d97757"   # Claude's brand orange – Claude working
%hidden SEL="#2d4f67"      # waveBlue2 – selection

# rounded powerline caps (Nerd Font)
%hidden L=""
%hidden R=""

# ─── Terminal ──────────────────────────────────────────────────────
set -g default-shell /bin/zsh
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"

set -g display-panes-time 4000

# no 500ms Esc delay (nvim), 1-based windows so M-1..M-4 match the keys,
# close gaps when a window dies, mouse for scroll/click-to-focus
set -sg escape-time 10
set -g base-index 1
set -g renumber-windows on
set -g mouse on
set-option -g history-limit 50000

# ─── Keybindings (unchanged) ───────────────────────────────────────
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-k
bind-key C-k send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Resize the current pane using Alt + direction
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

set -g status-keys vi
set -g mode-keys vi

# ─── Project / session switching (fzf popups) ──────────────────────
# Scripts live in ~/dot/scripts: tproj (projects), tsess (sessions), twin (windows).
# Each has a prefix binding and a no-prefix Alt binding.
#   prefix f / M-o   find project  → switch to (or create) its session   [was find-window]
#   prefix s / M-s   switch session (ctrl-x kills, new name + enter creates) [was choose-tree -s]
#   prefix w / M-w   switch window across all sessions                   [was choose-tree -w]
#   prefix Tab       jump back to the previous session
#   prefix ( )       prev/next session (tmux default, unchanged)
bind f   display-popup -E -w 80% -h 70% -T "#[fg=$VIOLET] projects " -d '#{pane_current_path}' "~/dot/scripts/tproj"
bind s   display-popup -E -w 80% -h 70% -T "#[fg=$VIOLET] sessions " -d '#{pane_current_path}' "~/dot/scripts/tsess"
bind w   display-popup -E -w 80% -h 70% -T "#[fg=$VIOLET] windows "  -d '#{pane_current_path}' "~/dot/scripts/twin"
bind -n M-o display-popup -E -w 80% -h 70% -T "#[fg=$VIOLET] projects " -d '#{pane_current_path}' "~/dot/scripts/tproj"
bind -n M-s display-popup -E -w 80% -h 70% -T "#[fg=$VIOLET] sessions " -d '#{pane_current_path}' "~/dot/scripts/tsess"
bind -n M-w display-popup -E -w 80% -h 70% -T "#[fg=$VIOLET] windows "  -d '#{pane_current_path}' "~/dot/scripts/twin"
bind Tab switch-client -l

# ─── Claude attention + quick windows ──────────────────────────────
# prefix a / M-a   jump to the next Claude that needs you (waiting > error > done), any session
# M-1 .. M-4       files / servers / git / agent (by name; plain sessions fall back to window 1-4)
bind a   run-shell "~/dot/scripts/tattn '#{window_id}'"
bind -n M-a run-shell "~/dot/scripts/tattn '#{window_id}'"
bind -n M-1 if -F '#{N/w:files}'   'select-window -t :files'   'select-window -t :1'
bind -n M-2 if -F '#{N/w:servers}' 'select-window -t :servers' 'select-window -t :2'
bind -n M-3 if -F '#{N/w:git}'     'select-window -t :git'     'select-window -t :3'
bind -n M-4 if -F '#{N/w:agent}'   'select-window -t :agent'   'select-window -t :4'

# ─── Status bar ────────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=$BAR,fg=$FG2"

# session pill: blue normally, green while prefix is held, yellow in copy mode
%hidden MODE="#{?client_prefix,$GREEN,#{?pane_in_mode,$YELLOW,$BLUE}}"
set -g status-left-length 40
set -g status-left "#[fg=$MODE,bg=$BAR]$L#[fg=$BAR,bg=$MODE,bold] #{=24:session_name}#[fg=$MODE,bg=$BAR,nobold]$R   "

# right: widget pills — filled with their state colour (zoom · claude in other sessions · git ·
# docker · battery when charging/low; soft grey otherwise) — then a
# blue date+clock pill that mirrors the session pill on the left.
# Widget pills come from ~/.tmux/pill.zsh; each prints its own trailing gap, so hidden ones take no space.
set -g status-right-length 160
set -g status-right "#{?window_zoomed_flag,#[fg=$YELLOW#,bg=$BAR]$L#[fg=$BAR#,bg=$YELLOW]\uF50C zoom#[fg=$YELLOW#,bg=$BAR]$R ,}#(~/.tmux/claude.sh summary #{session_id})#(~/.tmux/git.sh '#{pane_current_path}')#(~/.tmux/docker.sh)#(~/.tmux/battery.sh)#[fg=$BLUE,bg=$BAR]$L#[fg=$BAR,bg=$BLUE]%a %d %b  \U000F0150 #[bold]%H:%M#[fg=$BLUE,bg=$BAR,nobold]$R"

# Claude marker per window (set by ~/.tmux/claude.sh from Claude Code hooks):
#   orange ✻ = working · red bell = waiting on you · blue warning = error
#   green check = finished, not yet seen · grey ✻ = idle
%hidden CLAUDE="#{?#{==:#{@claude},waiting}, #[fg=$RED]\uF0F3,#{?#{==:#{@claude},error}, #[fg=$BLUE]\uF071,#{?#{==:#{@claude},working}, #[fg=$ORANGE]✻,#{?#{==:#{@claude},done}, #[fg=$GREEN]\uF00C,#{?#{==:#{@claude},idle}, #[fg=$GRAY]✻,}}}}}"

# windows: active = two-tone violet pill, inactive = same width, muted
set -g window-status-separator " "
set -g window-status-format " #[fg=$GRAY] #I #[fg=$GRAY] #W#{?window_zoomed_flag, ,}$CLAUDE  "
set -g window-status-current-format "#[fg=$VIOLET,bg=$BAR]$L#[fg=$BAR,bg=$VIOLET,bold]#I #[fg=$FG,bg=$INK3,nobold] #W#{?window_zoomed_flag, ,}$CLAUDE #[fg=$INK3,bg=$BAR]$R"
set -g window-status-style "fg=$GRAY,bg=$BAR"
set -g window-status-current-style "fg=$FG,bg=$BAR"
set -g window-status-activity-style "fg=$YELLOW,bg=$BAR"
set -g window-status-bell-style "fg=$RED,bg=$BAR,bold"

# visiting a window clears its Claude "finished" marker
set-hook -g session-window-changed 'run-shell -b "~/.tmux/claude.sh seen #{window_id}"'
set-hook -g client-session-changed 'run-shell -b "~/.tmux/claude.sh seen #{window_id}"'

# ─── Pane borders ──────────────────────────────────────────────────
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-style "fg=$INK3"
# active border: red = synchronize-panes, pink = marked, yellow = copy mode
set -g pane-active-border-style "fg=#{?pane_modal_flag,$BLUE,#{?pane_marked,$PINK,#{?synchronize-panes,$RED,#{?pane_in_mode,$YELLOW,$VIOLET}}}}"
set -g display-panes-colour "$GRAY"
set -g display-panes-active-colour "$VIOLET"

# ─── Messages, prompts, copy mode ──────────────────────────────────
# fill= paints the whole prompt line; without it, edited-away text is left
# behind. The condition mirrors tmux's default (no fill for in-pane/mode prompts).
%hidden NOFILL="#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}}"
set -g message-style "bg=$INK,fg=$FG,#{?$NOFILL,,fill=$INK}"
set -g message-command-style "bg=$INK,fg=$BLUE,#{?$NOFILL,,fill=$INK}"
set -g mode-style "noattr,bg=$VIOLET,fg=$BAR"
set -g copy-mode-match-style "bg=$INK3,fg=$FG"
set -g copy-mode-current-match-style "bg=$YELLOW,fg=$BAR"
set -g copy-mode-mark-style "bg=$PINK,fg=$BAR"
set -g clock-mode-colour "$VIOLET"
set -g clock-mode-style 24

# ─── Popups & menus ────────────────────────────────────────────────
set -g popup-style "bg=$BAR,fg=$FG"
set -g popup-border-style "fg=$VIOLET"
set -g popup-border-lines rounded
set -g menu-style "bg=$BAR,fg=$FG"
set -g menu-selected-style "bg=$SEL,fg=$FG"
set -g menu-border-style "fg=$INK3"
set -g menu-border-lines rounded

# ─── Misc ──────────────────────────────────────────────────────────
set-option -g allow-passthrough on
set-option -g set-clipboard on

set -g focus-events on
